# Recipes that run a downloaded installer fetch it first and pipe it to the shell
# only if curl succeeded: sh has no pipefail, so `curl -f URL | sh` exits 0 when
# the download fails (the shell runs the empty stream).

languages:
  - name: go
    command: go
    description: "Go programming language"
    macos:
      method: brew
      package: go
    # Extract into a staging dir under /usr/local and replace /usr/local/go only once
    # the staged go/bin/go exists, so a failed download never leaves a partial tree.
    # sh has no pipefail, so a failed curl doesn't fail its pipeline: the case guard
    # catches the empty VER, and `test -x` catches the empty stream some tars accept.
    # The fixed staging path is cleared on each run so a killed run's leftovers don't pile up.
    install_cmd: >-
      ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/') &&
      VER=$(curl -fsSL 'https://go.dev/VERSION?m=text' | head -1) &&
      case "$VER" in go[0-9]*) ;; *) echo "Unexpected Go version: '$VER'" >&2; exit 1 ;; esac &&
      STAGE=/usr/local/.go-install &&
      sudo rm -rf "$STAGE" &&
      sudo mkdir "$STAGE" &&
      trap 'sudo rm -rf "$STAGE"' EXIT &&
      curl -fsSL "https://go.dev/dl/${VER}.linux-${ARCH}.tar.gz" | sudo tar -C "$STAGE" -xz &&
      sudo test -x "$STAGE/go/bin/go" &&
      sudo rm -rf /usr/local/go &&
      sudo mv "$STAGE/go" /usr/local/go
    check_path: "/usr/local/go/bin/go"

  - name: rust
    command: rustup
    description: "Rust toolchain (via rustup)"
    install_cmd: >-
      script=$(curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs) &&
      printf '%s\n' "$script" | sh -s -- -y
    check_path: "~/.cargo/bin/rustup"

  - name: node
    command: node
    description: "Node.js (via nvm)"
    install_cmd: >-
      script=$(curl -fsS https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.0/install.sh) &&
      printf '%s\n' "$script" | bash &&
      export NVM_DIR="$HOME/.nvm" &&
      . "$NVM_DIR/nvm.sh" &&
      nvm install --lts
    check_path: "~/.nvm/versions/node/v*/bin/node"

  - name: ruby
    command: ruby
    description: "Ruby (via rvm)"
    install_cmd: >-
      curl -fsSL https://rvm.io/mpapis.asc | gpg --import - 2>/dev/null;
      curl -fsSL https://rvm.io/pkuczynski.asc | gpg --import - 2>/dev/null;
      script=$(curl -fsSL https://get.rvm.io) &&
      printf '%s\n' "$script" | bash -s stable
    check_path: "~/.rvm/bin/rvm"

  - name: flutter
    command: flutter
    description: "Flutter SDK (includes Dart)"
    # Same staging and swap as go. A failed releases_linux.json fetch can't yield an
    # empty ARCHIVE: python3 ends that pipeline and exits non-zero on invalid JSON.
    # Google only publishes an x64 Linux archive, so any other platform (including
    # macOS when brew fails) stops instead of installing an SDK that can't run.
    # A brace group, not a subshell, so the install timeout's kill stops the chain.
    install_cmd: >-
      brew install --cask flutter || {
      case "$(uname -sm)" in "Linux x86_64") ;; *) echo "No Flutter archive for $(uname -sm); install Flutter manually" >&2; exit 1 ;; esac &&
      ARCHIVE=$(curl -fsSL 'https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json' |
      python3 -c "import sys,json;d=json.load(sys.stdin);h=d['current_release']['stable'];print(next(r['archive'] for r in d['releases'] if r['hash']==h and r['channel']=='stable'))") &&
      STAGE=/usr/local/.flutter-install &&
      sudo rm -rf "$STAGE" &&
      sudo mkdir "$STAGE" &&
      trap 'sudo rm -rf "$STAGE"' EXIT &&
      curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/${ARCHIVE}" | sudo tar -C "$STAGE" -xJ &&
      sudo test -x "$STAGE/flutter/bin/flutter" &&
      sudo rm -rf /usr/local/flutter &&
      sudo mv "$STAGE/flutter" /usr/local/flutter; }
    # The SDK archive (and brew's cask download) is ~1.5 GB
    install_timeout: 1800
    check_path: "/usr/local/flutter/bin/flutter"

  - name: python
    command: uv
    description: "Python (via uv) — bootstrap prerequisite, status-only"
    status_only: true
